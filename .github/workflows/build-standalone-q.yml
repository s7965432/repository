name: Charlotte Companion Standalone v0.11.0-alpha1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-standalone-q.yml"
      - "CharlotteCompanion-Standalone-v0.11.0-alpha1-project.zip"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: charlotte-companion-v090-debug-key-v1

      - name: Unpack standalone project
        run: |
          rm -rf charlotte-standalone-build
          mkdir charlotte-standalone-build
          unzip -q CharlotteCompanion-Standalone-v0.11.0-alpha1-project.zip -d charlotte-standalone-build

      - name: Install Android native tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13113456" \
            "cmake;3.31.6"

      - name: Prepare pinned llama.cpp Android runtime
        run: |
          cd charlotte-standalone-build
          rm -rf llama.cpp-source
          git init llama.cpp-source
          cd llama.cpp-source
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin 9dcf84e5ae2718947188b539aab8b9c2b15d3ba1
          git checkout --detach FETCH_HEAD
          cd ..

          mkdir -p llama-lib/src/main/java
          mkdir -p llama-lib/src/main/cpp

          cp -R \
            llama.cpp-source/examples/llama.android/lib/src/main/java/* \
            llama-lib/src/main/java/

          cp \
            llama.cpp-source/examples/llama.android/lib/src/main/cpp/ai_chat.cpp \
            llama-lib/src/main/cpp/ai_chat.cpp

      - name: Download sherpa-onnx Android runtime
        run: |
          mkdir -p charlotte-standalone-build/app/libs
          curl -fL \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar" \
            -o charlotte-standalone-build/app/libs/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  charlotte-standalone-build/app/libs/sherpa-onnx-1.13.7.aar" \
            | sha256sum --check

      - name: Preflight
        working-directory: charlotte-standalone-build
        run: bash ci-preflight.sh

      - name: Build APK
        working-directory: charlotte-standalone-build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.13113456
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../build-log.txt

      - name: Validate APK
        run: |
          APK="charlotte-standalone-build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | tee badging.txt

          grep -q "package: name='com.charlotte.companion'" badging.txt
          grep -q "versionName='0.11.0-alpha1'" badging.txt

          unzip -l "$APK" | tee apk-files.txt
          grep -q "lib/arm64-v8a/libai-chat.so" apk-files.txt

          cp "$APK" CharlotteCompanion-Standalone-v0.11.0-alpha1-debug.apk
          sha256sum CharlotteCompanion-Standalone-v0.11.0-alpha1-debug.apk \
            > CharlotteCompanion-SHA256.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CharlotteCompanion-Standalone-v0.11.0-alpha1-result
          path: |
            CharlotteCompanion-Standalone-v0.11.0-alpha1-debug.apk
            CharlotteCompanion-SHA256.txt
            badging.txt
            apk-files.txt
            build-log.txt
          if-no-files-found: warn
