name: Charlotte v0.7.9-B Runtime Test C

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-c.yml"
      - "CharlotteAgent-v0.7.9-B-project.zip"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: unzip -q CharlotteAgent-v0.7.9-B-project.zip

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Create Android 36 AVD
        run: |
          echo "no" | avdmanager create avd \
            -n charlotte_api36 \
            -k "system-images;android-36;google_apis;x86_64" \
            --device "pixel_6" \
            --force

      - name: Start emulator manually
        run: |
          sudo chmod 666 /dev/kvm || true

          nohup emulator \
            -avd charlotte_api36 \
            -no-window \
            -no-audio \
            -no-snapshot \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator-console.log 2>&1 &

          adb wait-for-device

          for i in $(seq 1 180); do
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$BOOT" = "1" ]; then
              echo "Android 36 emulator booted"
              exit 0
            fi
            sleep 2
          done

          echo "Emulator failed to boot"
          cat emulator-console.log
          exit 1

      - name: Install and launch app
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.charlotte.agent

          adb shell am start -W \
            -n com.charlotte.agent/.MainActivity \
            | tee activity-start.txt

          sleep 5

          PID="$(adb shell pidof com.charlotte.agent | tr -d '\r')"

          if [ -z "$PID" ]; then
            echo "FAIL: process died"
            adb logcat -d -v time | tee emulator-logcat.txt
            exit 1
          fi

          adb shell dumpsys activity activities \
            | tee activity-state.txt

          adb logcat -d -v time \
            | tee emulator-logcat.txt

          if grep -q "FATAL EXCEPTION" emulator-logcat.txt; then
            echo "FAIL: FATAL EXCEPTION"
            exit 1
          fi

          grep -q "com.charlotte.agent/.MainActivity" activity-state.txt

          echo "PASS: MainActivity stayed alive on Android 36"

      - name: Prepare APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            CharlotteAgent-v0.7.9-B-debug.apk

          sha256sum CharlotteAgent-v0.7.9-B-debug.apk \
            > CharlotteAgent-SHA256.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CharlotteAgent-v0.7.9-B-runtime-test-C
          path: |
            CharlotteAgent-v0.7.9-B-debug.apk
            CharlotteAgent-SHA256.txt
            emulator-console.log
            activity-start.txt
            activity-state.txt
            emulator-logcat.txt
          if-no-files-found: warn
