name: Charlotte Companion v0.9.0-alpha3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-i.yml"
      - "CharlotteCompanion-v0.9.0-alpha3-project.zip"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: charlotte-companion-v090-debug-key-v1

      - name: Unpack project
        run: |
          rm -rf charlotte-build
          mkdir charlotte-build
          unzip -q CharlotteCompanion-v0.9.0-alpha3-project.zip -d charlotte-build

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Preflight
        working-directory: charlotte-build
        run: bash ci-preflight.sh

      - name: Build APK
        working-directory: charlotte-build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../build-log.txt

      - name: Validate APK
        run: |
          APK="charlotte-build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.charlotte.companion'" badging.txt
          grep -q "versionName='0.9.0-alpha3'" badging.txt
          cp "$APK" CharlotteCompanion-v0.9.0-alpha3-debug.apk
          sha256sum CharlotteCompanion-v0.9.0-alpha3-debug.apk > CharlotteCompanion-SHA256.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CharlotteCompanion-v0.9.0-alpha3-result
          path: |
            CharlotteCompanion-v0.9.0-alpha3-debug.apk
            CharlotteCompanion-SHA256.txt
            badging.txt
            build-log.txt
          if-no-files-found: warn
