name: Charlotte v0.7.9-B Build

on:
  push:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack project
        run: unzip -q CharlotteAgent-v0.7.9-B-project.zip

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Android 36 launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci-test.sh

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CharlotteAgent-v0.7.9-B-debug.apk
          sha256sum CharlotteAgent-v0.7.9-B-debug.apk > CharlotteAgent-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CharlotteAgent-v0.7.9-B
          path: |
            CharlotteAgent-v0.7.9-B-debug.apk
            CharlotteAgent-SHA256.txt
            activity-start.txt
            activity-state.txt
            emulator-logcat.txt
