name: Charlotte Android Build v0.7.9-B

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-build.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore project
        run: |
          echo "" | base64 -d > project.tgz
          tar xzf project.tgz

      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Android 36 launch test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            APK="app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.charlotte.agent
            adb shell am start -W -n com.charlotte.agent/.MainActivity | tee activity-start.txt
            sleep 5
            PID="$(adb shell pidof com.charlotte.agent | tr -d '\r')"
            test -n "$PID"
            adb shell dumpsys activity activities | tee activity-state.txt
            adb logcat -d -v time | tee emulator-logcat.txt
            ! grep -q "FATAL EXCEPTION" emulator-logcat.txt
            grep -q "com.charlotte.agent/.MainActivity" activity-state.txt

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CharlotteAgent-v0.7.9-B-debug.apk
          sha256sum CharlotteAgent-v0.7.9-B-debug.apk | tee CharlotteAgent-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CharlotteAgent-v0.7.9-B
          path: |
            CharlotteAgent-v0.7.9-B-debug.apk
            CharlotteAgent-SHA256.txt
            activity-start.txt
            activity-state.txt
            emulator-logcat.txt      - name: Create Charlotte Android project
        run: |
          mkdir -p app/src/main/java/com/charlotte/agent
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CharlotteAgent"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.charlotte.agent"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.charlotte.agent"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "0.7.9-B"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">夏洛特代理</string>
              <string name="accessibility_description">讓夏洛特讀取目前畫面介面並執行使用者允許的操作</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".WatchService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>

                  <service
                      android:name=".AgentAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>

                  </service>

              </application>

          </manifest>
