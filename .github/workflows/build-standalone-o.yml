name: Charlotte Companion Standalone v0.10.0-alpha1
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-standalone-o.yml"
      - "CharlotteCompanion-Standalone-v0.10.0-alpha1-project.zip"
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: charlotte-companion-v090-debug-key-v1
      - name: Unpack standalone project
        run: |
          rm -rf charlotte-standalone-build
          mkdir charlotte-standalone-build
          unzip -q CharlotteCompanion-Standalone-v0.10.0-alpha1-project.zip -d charlotte-standalone-build
      - name: Install Android tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Preflight
        working-directory: charlotte-standalone-build
        run: bash ci-preflight.sh
      - name: Build APK
        working-directory: charlotte-standalone-build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee ../build-log.txt
      - name: Validate APK
        run: |
          APK="charlotte-standalone-build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee badging.txt
          grep -q "package: name='com.charlotte.companion'" badging.txt
          grep -q "versionName='0.10.0-alpha1'" badging.txt
          cp "$APK" CharlotteCompanion-Standalone-v0.10.0-alpha1-debug.apk
          sha256sum CharlotteCompanion-Standalone-v0.10.0-alpha1-debug.apk > CharlotteCompanion-SHA256.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CharlotteCompanion-Standalone-v0.10.0-alpha1-result
          path: |
            CharlotteCompanion-Standalone-v0.10.0-alpha1-debug.apk
            CharlotteCompanion-SHA256.txt
            badging.txt
            build-log.txt
          if-no-files-found: warn
